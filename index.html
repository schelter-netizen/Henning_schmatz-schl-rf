
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schmatz & Schlürf Recipe Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFFCEB;
        }
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }
        .butter-yellow {
            background-color: #FFF9E3;
        }
        .butter-yellow-accent {
            background-color: #FDF2B3;
        }

        @keyframes sparkle-1 {
            0%, 100% { transform: translate(0, 0) scale(0); opacity: 0; }
            50% { transform: translate(-15px, -15px) scale(1.2); opacity: 1; }
        }
        @keyframes sparkle-2 {
            0%, 100% { transform: translate(0, 0) scale(0); opacity: 0; }
            50% { transform: translate(18px, -12px) scale(1); opacity: 0.8; }
        }
        @keyframes sparkle-3 {
            0%, 100% { transform: translate(0, 0) scale(0); opacity: 0; }
            50% { transform: translate(12px, 15px) scale(1.1); opacity: 0.9; }
        }
        @keyframes sparkle-4 {
            0%, 100% { transform: translate(0, 0) scale(0); opacity: 0; }
            50% { transform: translate(-18px, 10px) scale(0.9); opacity: 0.7; }
        }

        .star-anim-1 { animation: sparkle-1 2s ease-in-out infinite; }
        .star-anim-2 { animation: sparkle-2 2.5s ease-in-out infinite 0.2s; }
        .star-anim-3 { animation: sparkle-3 1.8s ease-in-out infinite 0.5s; }
        .star-anim-4 { animation: sparkle-4 2.2s ease-in-out infinite 0.3s; }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
