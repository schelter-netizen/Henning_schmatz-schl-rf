
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schmatz & Schlürf Recipe Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFFCEB;
        }
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }
        
        /* Star Sparkle Animations */
        @keyframes sparkle-1 {
            0%, 100% { transform: translate(0, 0) scale(0); opacity: 0; }
            50% { transform: translate(-30px, -25px) scale(1.5); opacity: 1; }
        }
        @keyframes sparkle-2 {
            0%, 100% { transform: translate(0, 0) scale(0); opacity: 0; }
            50% { transform: translate(35px, -20px) scale(1.2); opacity: 0.8; }
        }
        @keyframes sparkle-3 {
            0%, 100% { transform: translate(0, 0) scale(0); opacity: 0; }
            50% { transform: translate(25px, 20px) scale(1.4); opacity: 0.9; }
        }
        @keyframes sparkle-4 {
            0%, 100% { transform: translate(0, 0) scale(0); opacity: 0; }
            50% { transform: translate(-35px, 15px) scale(1.1); opacity: 0.7; }
        }

        .star-container span {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .made-by-mira-link:hover .star-anim-1 { animation: sparkle-1 2s ease-in-out infinite; opacity: 1; }
        .made-by-mira-link:hover .star-anim-2 { animation: sparkle-2 2.5s ease-in-out infinite 0.2s; opacity: 1; }
        .made-by-mira-link:hover .star-anim-3 { animation: sparkle-3 1.8s ease-in-out infinite 0.5s; opacity: 1; }
        .made-by-mira-link:hover .star-anim-4 { animation: sparkle-4 2.2s ease-in-out infinite 0.3s; opacity: 1; }
    </style>
    <script>
        // Shim process to prevent crashes in environments where it might be undefined at module load time
        window.process = window.process || { env: { API_KEY: "" } };
    </script>
<script type="importmap">

  }
}
</script>
</head>

</body>
</html>
